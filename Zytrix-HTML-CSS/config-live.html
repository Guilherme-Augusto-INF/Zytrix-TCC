<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zytrix — Configurar live</title><meta name="description" content="Zytrix — plataforma acadêmica de livestream"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main class="main"><div class="container"><div class="eyebrow">STREAMER</div><h1>Configurar live</h1><p>Status: <strong id="live-status">OFFLINE</strong></p><form id="live-config-form" class="card"><label>Título</label><input id="title" class="input" maxlength="120"><label>Descrição</label><textarea id="description" rows="4" maxlength="1000"></textarea><div class="row"><div><label>Categoria</label><input id="category" class="input" placeholder="Gaming"></div><div><label>Subcategoria</label><input id="subcat" class="input" placeholder="FPS"></div></div><label>Thumbnail (URL)</label><input id="thumbnail" class="input"><label>Canal Twitch</label><input id="twitch" class="input" placeholder="https://twitch.tv/seu_usuario"><div class="actions" style="margin-top:14px"><button class="btn btn-primary">Salvar</button><button type="button" id="start-live" class="btn">Iniciar live</button><button type="button" id="stop-live" class="btn btn-danger">Encerrar live</button></div><div id="config-msg"></div></form></div></main><div data-footer></div><script type="module" src="assets/js/config-live.js"></script></body></html>
