<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zytrix — Criar conta</title><meta name="description" content="Zytrix — plataforma acadêmica de livestream"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-header></div><main class="main"><form id="register-form" class="card form-card"><div class="eyebrow">COMECE AGORA</div><h1>Criar conta</h1><label>Nome de usuário</label><input id="username" class="input" maxlength="30" required><label>E-mail</label><input id="email" class="input" type="email" required autocomplete="email"><label>Senha</label><input id="password" class="input" type="password" minlength="6" required autocomplete="new-password"><label>Confirmar senha</label><input id="confirm" class="input" type="password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary" style="margin-top:14px;width:100%">Criar conta</button><button id="google-register" type="button" class="btn" style="margin-top:8px;width:100%">Criar com Google</button><div id="auth-msg"></div></form></main><div data-footer></div><script type="module" src="assets/js/auth-pages.js"></script></body></html>
